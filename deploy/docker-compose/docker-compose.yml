networks:
  rewearit-mesh:
    driver: bridge

volumes:
  redpanda-data:
  minio-data:
  postgres-catalog-data:
  postgres-orders-data:
  postgres-pricing-data:

services:
  # -------------------------------------------------------------
  # Message Streaming (Redpanda / Kafka API)
  # -------------------------------------------------------------
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.1.2
    container_name: rewearit-redpanda
    networks:
      - rewearit-mesh
    ports:
      - "9092:9092"
      - "9644:9644"
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    command:
      - redpanda start
      - --smp 1
      - --memory 1G
      - --overprovisioned
      - --kafka-addr internal://0.0.0.0:29092,external://0.0.0.0:9092
      - --advertise-kafka-addr internal://redpanda:29092,external://localhost:9092
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -iE 'healthy:.*true' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Redpanda Console (Web UI for Kafka visualization)
  console:
    image: docker.redpanda.com/redpandadata/console:v2.5.2
    container_name: rewearit-redpanda-console
    networks:
      - rewearit-mesh
    ports:
      - "8080:8080"
    environment:
      KAFKA_BROKERS: redpanda:29092
    depends_on:
      redpanda:
        condition: service_healthy

  # -------------------------------------------------------------
  # Distributed Caching & Locks (Redis)
  # -------------------------------------------------------------
  redis:
    image: redis:7.2-alpine
    container_name: rewearit-redis
    networks:
      - rewearit-mesh
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # -------------------------------------------------------------
  # Object Storage (S3 API via MinIO)
  # -------------------------------------------------------------
  minio:
    image: cgr.dev/chainguard/minio:latest
    container_name: rewearit-minio
    networks:
      - rewearit-mesh
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadminpassword
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  # -------------------------------------------------------------
  # Isolated Databases per Microservice
  # -------------------------------------------------------------
  postgres-catalog:
    image: pgvector/pgvector:pg16
    container_name: rewearit-postgres-catalog
    networks:
      - rewearit-mesh
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: catalog_db
      POSTGRES_USER: catalog_user
      POSTGRES_PASSWORD: catalog_password
    volumes:
      - postgres-catalog-data:/var/lib/postgresql/data
      - ./init-pgvector.sql:/docker-entrypoint-initdb.d/init-pgvector.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U catalog_user -d catalog_db"]
      interval: 5s
      timeout: 3s
      retries: 5

  postgres-orders:
    image: postgres:16-alpine
    container_name: rewearit-postgres-orders
    networks:
      - rewearit-mesh
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: orders_db
      POSTGRES_USER: orders_user
      POSTGRES_PASSWORD: orders_password
    volumes:
      - postgres-orders-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orders_user -d orders_db"]
      interval: 5s
      timeout: 3s
      retries: 5

  postgres-pricing:
    image: postgres:16-alpine
    container_name: rewearit-postgres-pricing
    networks:
      - rewearit-mesh
    ports:
      - "5434:5432"
    environment:
      POSTGRES_DB: pricing_db
      POSTGRES_USER: pricing_user
      POSTGRES_PASSWORD: pricing_password
    volumes:
      - postgres-pricing-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pricing_user -d pricing_db"]
      interval: 5s
      timeout: 3s
      retries: 5

  # -------------------------------------------------------------
  # Distributed Observability & Tracing (Jaeger / OpenTelemetry)
  # -------------------------------------------------------------
  jaeger:
    image: jaegertracing/all-in-one:1.57
    container_name: rewearit-jaeger
    networks:
      - rewearit-mesh
    ports:
      - "16686:16686" # Web UI
      - "4317:4317"   # OTLP gRPC receiver
      - "4318:4318"   # OTLP HTTP receiver
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:16686/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # -------------------------------------------------------------
  # Application Microservices & Asynchronous Workers
  # -------------------------------------------------------------
  catalog-service:
    image: rewearit-catalog-service:local
    container_name: rewearit-catalog-service
    networks:
      - rewearit-mesh
    ports:
      - "8001:8001"
      - "50051:50051"
    environment:
      DATABASE_URL: postgresql+asyncpg://catalog_user:catalog_password@postgres-catalog:5432/catalog_db
      KAFKA_BOOTSTRAP_SERVERS: redpanda:29092
      REDIS_URL: redis://redis:6379/0
      PORT: 8001
      GRPC_PORT: 50051
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
      OTEL_EXPORTER_OTLP_INSECURE: "true"
      OTEL_SERVICE_NAME: rewearit-catalog-service
    depends_on:
      postgres-catalog:
        condition: service_healthy
      redpanda:
        condition: service_healthy
      redis:
        condition: service_healthy
      jaeger:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8001/healthz\")' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  ai-worker:
    image: rewearit-ai-worker:local
    container_name: rewearit-ai-worker
    networks:
      - rewearit-mesh
    ports:
      - "8002:8002"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: redpanda:29092
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: http://minio:9000
      HEALTH_PORT: 8002
      VLM_PROVIDER: heuristic
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
      OTEL_EXPORTER_OTLP_INSECURE: "true"
      OTEL_SERVICE_NAME: rewearit-ai-worker
    depends_on:
      redpanda:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      jaeger:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8002/healthz\")' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
